version: "3.9"

# Production overlay — use with:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ── PostgreSQL (internal only) ─────────────────────────────
  postgres:
    ports: []                              # never exposed externally
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── Redis (internal only) ──────────────────────────────────
  redis:
    ports: []                              # never exposed externally
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── ClickHouse (internal only) ─────────────────────────────
  clickhouse:
    ports: []
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ── FastAPI Backend (hardened) ─────────────────────────────
  backend:
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --no-access-log
    ports: []                              # only nginx talks to backend
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - external
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
      restart_policy:
        condition: on-failure
        max_attempts: 5

  # ── Celery Worker (hardened) ───────────────────────────────
  celery-worker:
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=100M
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── Ollama (internal only) ────────────────────────────────
  ollama:
    ports: []
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  # ── Nginx (SSL termination) ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: financeapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - external
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

networks:
  internal:
    driver: bridge
    internal: true                         # no external access
  external:
    driver: bridge
